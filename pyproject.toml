[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "multihawk"
authors = [{ name = "shtmjp", email = "shtm.1058@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = []

[tool.maturin]
module-name = "multihawk.multihawk_rs"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "pytest>=8.3.5",
    "pre-commit>=4.1.0",
    "pyright>=1.1.392.post0",
    "ruff>=0.9.2",
    "seaborn>=0.13.2",
    "line-profiler>=4.2.0",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
]
ext-tests = ["hawkes>=1.0.0", "hawkesbook>=0.1.0", "sparklen>=1.0.0"]
